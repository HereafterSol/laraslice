schema_version: 1
name: Portfolio
handle: portfolio
description: 'Track delivery portfolios and their project tasks with owner, due date, priority, and status.'
models:
  -
    handle: portfolio
    table: portfolios
    root: true
    fields:
      -
        handle: name
        label: 'Portfolio name'
        type: string
        required: true
      -
        handle: owner_email
        label: 'Owner email'
        type: string
        input: email
        required: true
      -
        handle: is_active
        label: Active
        type: boolean
        default: true
    relations:
      -
        name: portfolio_tasks
        type: hasMany
        model: portfolio_task
        foreign_key: portfolio_id
  -
    handle: portfolio_task
    table: portfolio_tasks
    fields:
      -
        handle: portfolio_id
        label: Portfolio
        type: integer
        input: select
        required: true
      -
        handle: title
        label: 'Task title'
        type: string
        required: true
      -
        handle: priority
        label: Priority
        type: string
        input: select
        default: normal
        options:
          low: Low
          normal: Normal
          high: High
      -
        handle: status
        label: Status
        type: string
        input: select
        default: planned
        options:
          planned: Planned
          in_progress: 'In progress'
          blocked: Blocked
          complete: Complete
      -
        handle: due_date
        label: 'Due date'
        type: date
        nullable: true
    relations:
      -
        name: portfolio
        type: belongsTo
        model: portfolio
        foreign_key: portfolio_id
ui:
  presentation:
    create: drawer
    edit: drawer
  directory:
    columns:
      -
        handle: name
        label: 'Portfolio name'
        formatter: text
        sortable: true
      -
        handle: owner_email
        label: 'Owner email'
        formatter: text
        sortable: true
      -
        handle: is_active
        label: Active
        formatter: text
        sortable: true
    quick_filters: {  }
    sidebar_filters: {  }
  forms:
    sections:
      -
        key: general_details
        title: 'Portfolio Information'
        grid: 3
        fields:
          - { handle: name, span: 1, is_searchable: false }
          - { handle: owner_email, span: 1, is_searchable: false }
          - { handle: is_active, span: 1, is_searchable: false }
