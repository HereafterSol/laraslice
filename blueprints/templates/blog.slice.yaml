schema_version: 1
name: Articles
handle: articles
domain: Content
author: 'LaraSlice Team'
version: 1.0.0
description: 'Editorial articles, publishing lifecycle, and discussion comments.'
models:
  -
    handle: article
    table: articles
    root: true
    timestamps: true
    soft_deletes: true
    fields:
      -
        handle: title
        label: 'Article Title'
        type: string
        required: true
        length: 255
      -
        handle: slug
        label: 'URL Slug'
        type: string
        required: true
        length: 255
      -
        handle: excerpt
        label: Excerpt
        type: text
        required: false
        nullable: true
      -
        handle: status
        label: 'Publish State'
        type: enum
        required: true
        default: draft
        options:
          draft: Draft
          in_review: 'In Review'
          published: Published
          archived: Archived
ui:
  presentation:
    create: drawer
    edit: drawer
  directory:
    columns:
      -
        handle: title
        label: 'Article Title'
        formatter: text
        sortable: true
      -
        handle: slug
        label: 'URL Slug'
        formatter: text
        sortable: true
      -
        handle: excerpt
        label: Excerpt
        formatter: text
        sortable: true
      -
        handle: status
        label: 'Publish State'
        formatter: status_pill
        sortable: true
    quick_filters:
      -
        handle: status
        label: 'Publish State'
        is_searchable: true
    sidebar_filters: {  }
  forms:
    sections:
      -
        key: general_details
        title: 'Articles Information'
        grid: 3
        fields:
          - { handle: title, span: 1, is_searchable: false }
          - { handle: slug, span: 1, is_searchable: false }
          - { handle: excerpt, span: 3, is_searchable: false }
          - { handle: status, span: 1, is_searchable: true }
