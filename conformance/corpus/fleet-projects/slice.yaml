        type: chart
        chart: pie
        title: Tasks
        relation: tasks
        group_by: board_column_id
        labels:
          1: Incomplete
          2: 'To Do'
          3: Doing
          4: Completed
        colors:
          1: '#d21010'
          2: '#f5c308'
          3: '#00b5ff'
          4: '#679c0d'
        legend: labels
      -
        handle: hours_logged_bars
        type: bars
        title: 'Hours Logged'
        style: columns
        bars:
          -
            label: Planned
            color: '#16a34a'
            field: hours_allocated
            decimals: 2
          -
            label: Actual
            color: '#dc2626'
            relation: projectTimeLogs
            aggregate: sum
            column: total_hours
            decimals: 2
      -
        handle: project_budget_bars
        type: bars
        title: 'Project Budget'
        style: columns
        bars:
          -
            label: Planned
            color: '#16a34a'
            field: project_budget
          -
            label: Actual
            color: '#dc2626'
            relation: invoices
            aggregate: sum
            column: total
      -
        handle: statistics_overview
        type: stats
        title: Statistics
        placement: rail
        layout: cards
        columns: 2
        heading: Statistics
        measures:
          -
            label: 'Project Budget'
            field: project_budget
            default: 0
            icon: coins
          -
            label: 'Hours Logged'
            relation: projectTimeLogs
            aggregate: sum
            column: total_hours
            default: 0
            icon: clock
      -
        handle: statistics_money
        type: stats
        title: Statistics
        placement: rail
        layout: cards
        columns: 3
        measures:
          -
            label: Earnings
            relation: invoices
            aggregate: sum
            column: total
            prefix: PKR
            decimals: 2
            default: 0
            icon: coins
          -
            label: Expenses
            relation: expenses
            aggregate: sum
            column: price
            prefix: PKR
            decimals: 2
            default: 0
            icon: coins
          -
            label: Profit
            minus:
              -
                relation: invoices
                aggregate: sum
                column: total
              -
                relation: expenses
                aggregate: sum
                column: price
            prefix: PKR
            decimals: 2
            icon: coins
      -
        handle: project_details_text
        type: text
        title: 'Project Details'
        from: project_summary
    identity:
