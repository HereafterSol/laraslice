name: Invoices
title: Invoices
domain: ERP
description: ERP pilot — invoices with money_breakdown (admin/client only)
version: 1.1.0
enabled: true
multitenant: false
navigation:
  label: Invoices
  icon: file-text
  group: Finance
  order: 40
  visible: true
  roles:
    - admin
    - client
ui:
  directory:
    views:
      - table
      - calendar
    default_view: table
    inline_edit:
      - status
    bulk_actions:
      - handle: delete
        label: Delete
        type: native
      - handle: export
        label: Export
        type: native
    row_actions:
      display: hybrid
    columns:
      - key: invoice_number
        label: Invoice
        formatter: code_badge
        sortable: true
      - key: amount
        label: Amount
        formatter: money_breakdown
        breakdown:
          paid: amount
          unpaid: amount
      - key: invoice_status_code
        label: Status
        formatter: status_pill
      - key: invoiced_at
        label: Issued
        formatter: date_time
      - key: due_at
        label: Due
        formatter: date_time
  dashboard:
    enabled: true
    widgets:
      - type: stat
        handle: outstanding
        label: Outstanding
fields:
  invoice_number:
    name: invoice_number
    type: string
    searchable: true
  amount:
    name: amount
    type: decimal
  invoice_status_code:
    name: invoice_status_code
    type: string
  invoiced_at:
    name: invoiced_at
    type: date
  due_at:
    name: due_at
    type: date
workflow: true
