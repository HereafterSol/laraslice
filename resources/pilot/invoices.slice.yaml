name: Invoices
title: Invoices
domain: ERP
description: ERP pilot — invoices with money_breakdown (admin/client only)
version: 1.1.0
enabled: true
multitenant: false
navigation:
  label: Invoices
  icon: file-text
  group: Finance
  order: 40
  visible: true
  roles:
    - admin
    - client
ui:
  directory:
    views:
      - table
      - calendar
    default_view: table
    inline_edit:
      - status
    bulk_actions:
      - handle: delete
        label: Delete
        type: native
      - handle: export
        label: Export
        type: native
    row_actions:
      display: hybrid
    columns:
      - key: invoice_number
        label: Invoice
        formatter: code_badge
        sortable: true
      - key: total
        label: Amount
        formatter: money_breakdown
        breakdown:
          paid: paid_amount
          unpaid: due_amount
      - key: status
        label: Status
        formatter: status_pill
      - key: issue_date
        label: Issued
        formatter: date_time
      - key: due_date
        label: Due
        formatter: date_time
  dashboard:
    enabled: true
    widgets:
      - type: stat
        handle: outstanding
        label: Outstanding
fields:
  invoice_number:
    name: invoice_number
    type: string
    searchable: true
  total:
    name: total
    type: decimal
  paid_amount:
    name: paid_amount
    type: decimal
  due_amount:
    name: due_amount
    type: decimal
  status:
    name: status
    type: string
  issue_date:
    name: issue_date
    type: date
  due_date:
    name: due_date
    type: date
workflow: true
